name: Scan & Update Graph

on:
  schedule:
    - cron: "0 3 * * *"   # daily at 03:00 UTC
  workflow_dispatch:        # manual trigger

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build --filter @archmap/analyzer --filter @archmap/graph-builder --filter @archmap/deployers

      - name: Scan GitHub org
        env:
          GITHUB_TOKEN: ${{ secrets.ARCHMAP_TOKEN }}
          GITHUB_ORG: docktail
          SCANNER_SOURCE: github
          DEPLOYER: git
          OUTPUT_DIR: data
        run: pnpm --filter @archmap/scanner scan

      - name: Trigger Pages deploy
        if: success()
        run: |
          echo "Graph updated — Pages workflow will pick up the new data/graph.json"
